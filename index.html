function landing(){root.innerHTML=`<header class="top"><div class="logo">Casa<span>Match</span></div><button class="btn ghost" id="login">Entrar</button></header><main class="landing"><section class="heroWrap"><div class="heroCopy"><div class="eyebrow"><i></i> Grande Lisboa · beta</div><h1 class="heroTitle">Dividir a casa é fácil. Encontrar a <em>pessoa certa</em> é que importa.</h1><p class="heroLead">Conheça pessoas compatíveis pelo orçamento, zonas onde procuram e hábitos de casa. Primeiro o roommate. Depois, a casa.</p><div class="actions"><button class="btn red" id="signup">Criar perfil grátis</button><button class="btn ghost" id="how">Ver como funciona</button></div><div class="heroNote"><span><i class="tick">✓</i> Grátis para começar</span><span><i class="tick">✓</i> Perfis 18+</span><span><i class="tick">✓</i> Compatibilidade antes do contacto</span></div></div><div class="demoShell"><div class="blob"></div><div class="floating one">📍 Almada · até <b>550 €</b></div><div class="demoCard"><div class="demoPhoto"><div class="matchScore">94% compatível</div></div><div class="demoInfo"><div class="demoName">Mariana, 29</div><div class="demoMeta">Cacilhas · procura Almada e Lisboa</div><div class="demoTags"><span>🚭 não fuma</span><span>🐾 aceita pets</span><span>☀️ dorme cedo</span></div></div></div><div class="floating two">✨ Vocês procuram zonas parecidas</div></div></section><section class="trust"><div class="trustItem"><strong>Não é um portal de imóveis</strong><span>O CasaMatch começa pela pessoa com quem vai dividir a rotina.</span></div><div class="trustItem"><strong>Compatibilidade de verdade</strong><span>Orçamento, zona, limpeza, horários, pets e estilo de casa entram no match.</span></div><div class="trustItem"><strong>Sem pressão para pagar</strong><span>Crie o perfil, descubra pessoas e faça matches gratuitamente no beta.</span></div></section></main><section class="section" id="como"><div class="sectionInner"><div class="sectionHead"><span class="pill">Como funciona</span><h2>Três passos. Sem complicar.</h2><p>A ideia é simples: reduzir o risco de descobrir tarde demais que vocês nunca deveriam ter dividido uma casa.</p></div><div class="steps"><div class="step"><div class="stepNum">1</div><h3>Conte como vive</h3><p>Escolha orçamento, zonas, rotina, limpeza, horários, animais e algumas preferências.</p></div><div class="step"><div class="stepNum">2</div><h3>Descubra pessoas</h3><p>Veja perfis ordenados por compatibilidade e deslize para gostar ou passar.</p></div><div class="step"><div class="stepNum">3</div><h3>Conversem no match</h3><p>Quando o interesse é mútuo, vocês podem conversar e decidir os próximos passos.</p></div></div></div></section><section class="betaStrip"><div class="betaInner"><div><h3>Estamos a começar pela Grande Lisboa.</h3><p>Entra no beta e ajuda a construir uma forma melhor de encontrar roommate.</p></div><button class="btn" id="signup2">Quero experimentar</button></div></section>`;document.getElementById('login').onclick=()=>auth('login');document.getElementById('signup').onclick=()=>auth('signup');document.getElementById('signup2').onclick=()=>auth('signup');document.getElementById('how').onclick=()=>document.getElementById('como').scrollIntoView({behavior:'smooth'})}

async function after(){let r=await sb.auth.getSession();session=r.data.session;if(!session)return landing();let q=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();profile=q.data;if(!profile?.onboarding_complete)onboard();else app('discover')}
function onboard(){let p=profile||{};root.innerHTML='<header class="top"><div class="logo">Casa<b>Match</b></div><button class="btn ghost" id="out">Sair</button></header><main class="on"><span class="pill">O seu perfil</span><h1>Vamos encontrar alguém compatível.</h1><form id="of"><div class="row"><div class="field"><label>Nome</label><input name="display_name" required value="'+esc(p.display_name||'')+'"></div><div class="field"><label>Nascimento</label><input name="birth_date" type="date" required value="'+(p.birth_date||'')+'"></div></div><div class="row"><div class="field"><label>Género</label><select name="gender"><option value="mulher">Mulher</option><option value="homem">Homem</option><option value="nao_binario">Não binário</option><option value="prefiro_nao_dizer">Prefiro não dizer</option></select></div><div class="field"><label>Zona atual</label><select name="area">'+areas.map(a=>'<option>'+a+'</option>').join('')+'</select></div></div><div class="field"><label>Zonas onde procura</label><div class="chips">'+areas.map(a=>'<label class="chip"><input type="checkbox" name="preferred_areas" value="'+a+'"><span>'+a+'</span></label>').join('')+'</div></div><div class="row"><div class="field"><label>Orçamento máximo €</label><input name="max_budget" type="number" min="150" max="5000" required value="'+(p.max_budget||650)+'"></div><div class="field"><label>Mudança</label><input name="move_in_date" type="date" value="'+(p.move_in_date||'')+'"></div></div><div class="field"><label>Limpeza 1–5</label><input name="cleanliness" type="range" min="1" max="5" value="'+(p.cleanliness||3)+'"></div><div class="field"><label>Casa tranquila ↔ social</label><input name="social_level" type="range" min="1" max="5" value="'+(p.social_level||3)+'"></div><div class="row"><div class="field"><label>Horário</label><select name="sleep_schedule"><option value="cedo">Durmo cedo</option><option value="flexivel">Flexível</option><option value="tarde">Durmo tarde</option></select></div><div class="field"><label>Trabalho</label><select name="work_mode"><option value="fora">Fora</option><option value="hibrido">Híbrido</option><option value="casa">Em casa</option></select></div></div><div class="chips" style="margin:14px 0"><label class="chip"><input type="checkbox" name="smokes"><span>🚬 Fumo</span></label><label class="chip"><input type="checkbox" name="has_pets"><span>🐾 Tenho animal</span></label><label class="chip"><input type="checkbox" name="accepts_pets" checked><span>🐶 Aceito animais</span></label></div><div class="field"><label>Sobre si</label><textarea name="bio" maxlength="220">'+esc(p.bio||'')+'</textarea></div><div class="field"><label>Foto opcional</label><input name="photo" type="file" accept="image/*"></div><button class="btn red w">Começar</button><div id="err"></div></form></main>';document.getElementById('out').onclick=logout;let f=document.getElementById('of');if(p.gender)f.gender.value=p.gender;if(p.area)f.area.value=p.area;(p.preferred_areas||[]).forEach(a=>{let x=[...f.querySelectorAll('[name=preferred_areas]')].find(y=>y.value===a);if(x)x.checked=true});f.onsubmit=async e=>{e.preventDefault();let fd=new FormData(f),cut=new Date();cut.setFullYear(cut.getFullYear()-18);if(new Date(fd.get('birth_date'))>cut){document.getElementById('err').innerHTML='<div class="notice">É necessário ter 18 anos ou mais.</div>';return}try{let pp=p.photo_path||null,file=f.photo.files[0];if(file){let path=session.user.id+'/'+Date.now()+'-'+file.name.replace(/[^a-z0-9._-]/gi,'_'),u=await sb.storage.from('profile-photos').upload(path,file,{upsert:true});if(u.error)throw u.error;pp=path}let data={id:session.user.id,display_name:fd.get('display_name'),birth_date:fd.get('birth_date'),gender:fd.get('gender'),city:'Grande Lisboa',area:fd.get('area'),preferred_areas:fd.getAll('preferred_areas'),max_budget:+fd.get('max_budget'),move_in_date:fd.get('move_in_date')||null,bio:fd.get('bio'),photo_path:pp,smokes:fd.get('smokes')==='on',has_pets:fd.get('has_pets')==='on',accepts_pets:fd.get('accepts_pets')==='on',cleanliness:+fd.get('cleanliness'),social_level:+fd.get('social_level'),sleep_schedule:fd.get('sleep_schedule'),work_mode:fd.get('work_mode'),guests_frequency:'as_vezes',preferred_gender:'qualquer',onboarding_complete:true,is_active:true},q=await sb.from('profiles').upsert(data).select().single();if(q.error)throw q.error;profile=q.data;app('discover')}catch(x){document.getElementById('err').innerHTML='<div class="notice">'+esc(x.message)+'</div>'}}}
function chrome(c,t){clearInterval(timer);root.innerHTML='<div class="app"><header class="head"><div class="logo">Casa<b>Match</b></div><div class="quota" id="quota">...</div></header><main class="main" id="main">'+c+'</main><nav class="bottom"><div class="bin"><button class="nav '+(t==='discover'?'active':'')+'" data-t="discover"><span>⌁</span>Descobrir</button><button class="nav '+(t==='matches'?'active':'')+'" data-t="matches"><span>♡</span>Matches</button><button class="nav '+(t==='profile'?'active':'')+'" data-t="profile"><span>◉</span>Perfil</button></div></nav></div>';document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>app(x.dataset.t));quota()}
async function quota(){let q=await sb.rpc('free_contact_status'),s=q.data?.[0],e=document.getElementById('quota');if(e&&s)e.textContent=s.plus?'CasaMatch+':'Conversas '+s.remaining+'/3'}
function app(t){if(t==='discover')discover();if(t==='matches')matches();if(t==='profile')profileView()}
async function discover(force=false){chrome('<h1 class="title">Descobrir</h1><div class="empty">A procurar perfis...</div>','discover');if(force||!cands.length||ci>=cands.length){let q=await sb.rpc('get_candidates',{limit_count:30});if(q.error){document.getElementById('main').innerHTML='<div class="empty">'+esc(q.error.message)+'</div>';return}cands=q.data||[];ci=0}draw()}
function traits(c){let a=[];if(!c.smokes)a.push('🚭 não fuma');if(c.accepts_pets)a.push('🐾 aceita pets');a.push(c.sleep_schedule==='tarde'?'🌙 dorme tarde':c.sleep_schedule==='cedo'?'☀️ dorme cedo':'⏰ flexível');return a}
function draw(){let c=cands[ci];if(!c){document.getElementById('main').innerHTML='<h1 class="title">Descobrir</h1><div class="empty"><h3>Por agora é tudo.</h3><p>Convide alguém que também esteja à procura de casa.</p></div>';return}let ph=pic(c.photo_path);document.getElementById('main').innerHTML='<h1 class="title">Descobrir</h1><div id="card" class="cand"><div class="photo">'+(ph?'<img src="'+ph+'">':'<div class="ini">'+esc(ini(c.display_name))+'</div>')+'<div class="score">'+c.score+'% compatível</div></div><div class="body"><div class="name">'+esc(c.display_name)+', '+c.age+'</div><div class="meta">📍 '+esc(c.area||c.city)+' · até '+c.max_budget+' €/mês</div><div class="traits">'+traits(c).map(x=>'<span class="trait">'+x+'</span>').join('')+'</div><div class="bio">'+esc(c.bio||'')+'</div></div></div><div class="sw"><button class="circle" id="rew">↶</button><button class="btn ghost" id="pass">Passar</button><button class="circle like" id="like">♥</button></div>';document.getElementById('pass').onclick=()=>swipe('pass');document.getElementById('like').onclick=()=>swipe('like');document.getElementById('rew').onclick=rewind;drag(document.getElementById('card'))}
function drag(el){let s=0,d=0,on=false;el.onpointerdown=e=>{on=true;s=e.clientX;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(on){d=e.clientX-s;el.style.transform='translateX('+d+'px) rotate('+(d/35)+'deg)'}};el.onpointerup=()=>{on=false;if(Math.abs(d)>95)swipe(d>0?'like':'pass');else el.style.transform='';d=0}}
async function rewind(){let s=await sb.rpc('free_contact_status');if(!s.data?.[0]?.plus)return plus();let r=await sb.rpc('rewind_last_pass');if(r.error)return toast(r.error.message);if(!r.data)return toast('Nada para desfazer');cands=[];await discover(true)}
async function swipe(direction){let c=cands[ci],q=await sb.from('swipes').insert({actor_id:session.user.id,target_id:c.id,direction});if(q.error)return toast(q.error.message);if(direction==='like'){let m=await sb.rpc('get_my_matches');if((m.data||[]).some(x=>x.other_id===c.id))pop('É match!','Vocês gostaram um do outro. Já podem conversar.')}ci++;draw()}
async function matches(){chrome('<h1 class="title">Matches</h1><div class="empty">A carregar...</div>','matches');let [m,l]=await Promise.all([sb.rpc('get_my_matches'),sb.rpc('incoming_like_count')]);let a=m.data||[],h='<h1 class="title">Matches</h1>';if((l.data||0)>0)h+='<div class="notice">♡ '+l.data+' pessoa(s) gostou de si.</div>';h+=a.length?a.map(x=>{let ph=pic(x.photo_path);return '<div class="match" data-id="'+x.match_id+'"><div class="av">'+(ph?'<img src="'+ph+'">':esc(ini(x.display_name)))+'</div><div class="grow"><b>'+esc(x.display_name)+', '+x.age+' · '+x.score+'%</b><div class="small">'+esc(x.area||'Grande Lisboa')+' · até '+x.max_budget+' €</div><div class="last">'+esc(x.last_message||'Diga olá 👋')+'</div></div><span>›</span></div>'}).join(''):'<div class="empty"><h3>Ainda sem matches.</h3><p>Continue a descobrir.</p></div>';document.getElementById('main').innerHTML=h;document.getElementById('main').querySelectorAll('.match').forEach(e=>e.onclick=()=>chat(e.dataset.id,a.find(x=>x.match_id===e.dataset.id)))}
async function chat(id,m){cur={id,m};chrome('','matches');document.getElementById('main').innerHTML='<div class="chat"><div class="chathead"><button class="link" id="back">← Matches</button><b>'+esc(m.display_name)+'</b><span></span></div><div id="msgs" class="msgs"></div><form id="cf" class="compose"><input id="msg" maxlength="1500" placeholder="Escreva uma mensagem..."><button>Enviar</button></form></div>';document.getElementById('back').onclick=matches;document.getElementById('cf').onsubmit=send;await load();timer=setInterval(load,4000)}
async function load(){let q=await sb.from('messages').select('sender_id,body,created_at').eq('match_id',cur.id).order('created_at'),mb=document.getElementById('msgs');if(!mb)return;mb.innerHTML=(q.data||[]).map(x=>'<div class="bubble '+(x.sender_id===session.user.id?'me':'')+'">'+esc(x.body)+'</div>').join('')||'<div class="small" style="text-align:center;margin-top:20px">O match está feito. Comece quando quiser.</div>';mb.scrollTop=mb.scrollHeight}
async function send(e){e.preventDefault();let mi=document.getElementById('msg'),b=mi.value.trim();if(!b)return;let q=await sb.from('messages').insert({match_id:cur.id,sender_id:session.user.id,body:b});if(q.error)return plus('Atingiu o limite de novas conversas gratuitas.');mi.value='';load();quota()}
async function profileView(){chrome('<h1 class="title">Perfil</h1>','profile');let [p,s]=await Promise.all([sb.from('profiles').select('*').eq('id',session.user.id).single(),sb.rpc('free_contact_status')]);profile=p.data||profile;let st=s.data?.[0],ph=pic(profile.photo_path);document.getElementById('main').innerHTML='<h1 class="title">Perfil</h1><div class="profile"><div style="display:flex;gap:13px;align-items:center"><div class="av" style="width:64px;height:64px">'+(ph?'<img src="'+ph+'">':esc(ini(profile.display_name)))+'</div><div><div class="name" style="font-size:22px">'+esc(profile.display_name)+'</div><div class="small">'+esc(profile.area)+' · até '+profile.max_budget+' €/mês</div></div></div><div class="stats"><div class="stat"><span class="small">Novas conversas</span><b>'+(st?.plus?'∞':st?.remaining+'/3')+'</b><span class="small">a cada 48h</span></div><div class="stat"><span class="small">Plano</span><b>'+(st?.plus?'Plus':'Grátis')+'</b><span class="small">beta</span></div></div><button class="btn red w" id="pl">CasaMatch+</button><div style="height:8px"></div><button class="btn ghost w" id="edit">Editar perfil</button><div style="height:8px"></div><button class="btn ghost w" id="lo">Sair</button></div>';document.getElementById('pl').onclick=plus;document.getElementById('edit').onclick=onboard;document.getElementById('lo').onclick=logout}
function plus(msg='Não precisa pagar para usar. O Plus é para quem quer avançar sem esperar.'){pop('CasaMatch+',msg,'<div class="plans"><div class="plan"><div><b>7 dias</b><div class="small">conversas ilimitadas · Rewind · ver likes</div></div><b>3,99 €</b></div><div class="plan"><div><b>30 dias</b><div class="small">tudo ilimitado</div></div><b>6,99 €</b></div></div><div class="notice">No beta o pagamento ainda não está ativo.</div>')}
async function logout(){await sb.auth.signOut();session=null;profile=null;cands=[];landing()}
(async()=>{let r=await sb.auth.getSession();session=r.data.session;if(session)after();else landing()})();
</script>
</body></html>
